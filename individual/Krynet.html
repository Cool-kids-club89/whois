<script>
(async () => {
    const API =
        "https://raw.githubusercontent.com/Krynet-LLC/Preview/refs/heads/main";

    const KRYNET_IMAGE =
        "https://github.com/Cool-kids-club89/whois/blob/main/image0.png?raw=true";

    async function getFile(path) {
        const url = `${API}/${path}`;

        const res = await fetch(url, {
            cache: "no-cache"
        });

        if (!res.ok) {
            throw new Error(`${path}: HTTP ${res.status}`);
        }

        return await res.text();
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>'"]/g, tag => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
        }[tag]));
    }

    try {
        /*
         * 1. CSS
         */
        const css = await getFile("styles.css");

        const style = document.createElement("style");
        style.textContent = css;
        document.head.appendChild(style);


        /*
         * 2. HTML
         */
        const html = await getFile("index.html");

        const doc = new DOMParser()
            .parseFromString(html, "text/html");

        /*
         * Remove scripts from index.html.
         * We load JavaScript ourselves.
         */
        doc.querySelectorAll("script").forEach(script => {
            script.remove();
        });

        /*
         * Copy body content.
         */
        document.body.innerHTML = doc.body.innerHTML;


        /*
         * 2.5 Add image0.png
         */
        const imageWrapper = document.createElement("div");

        imageWrapper.style.cssText = `
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 24px 0;
        `;

        const image = document.createElement("img");

        image.src = KRYNET_IMAGE;
        image.alt = "Krynet UI";
        image.loading = "lazy";
        image.decoding = "async";

        image.style.cssText = `
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        `;

        imageWrapper.appendChild(image);
        document.body.appendChild(imageWrapper);


        /*
         * 3. Load java.js
         *
         * java.js expects config.json at ./config.json.
         * Rewrite that request to the GitHub-hosted config.
         */
        let js = await getFile("java.js");

        const configUrl =
            `${API}/config.json`;

        js = js.replace(
            /fetch\s*\(\s*['"`]\.\/config\.json['"`]\s*,?/,
            `fetch("${configUrl}",`
        );

        /*
         * Execute java.js.
         */
        const mainScript = document.createElement("script");

        mainScript.textContent = js;

        document.body.appendChild(mainScript);


        /*
         * 4. Re-execute any non-java.js scripts
         * from index.html.
         */
        const originalScripts =
            Array.from(
                new DOMParser()
                    .parseFromString(html, "text/html")
                    .querySelectorAll("script")
            );

        for (const oldScript of originalScripts) {

            /*
             * java.js was already loaded above.
             */
            if (
                oldScript.src &&
                oldScript.src.includes("java.js")
            ) {
                continue;
            }

            const newScript =
                document.createElement("script");

            if (oldScript.src) {

                let src =
                    oldScript.getAttribute("src");

                /*
                 * Convert relative script paths
                 * to GitHub-hosted paths.
                 */
                if (
                    src &&
                    !src.startsWith("http://") &&
                    !src.startsWith("https://") &&
                    !src.startsWith("//")
                ) {
                    src =
                        `${API}/${src.replace(/^\.?\//, "")}`;
                }

                newScript.src = src;
                newScript.async = false;

            } else {
                newScript.textContent =
                    oldScript.textContent;
            }

            document.body.appendChild(newScript);
        }

    } catch (err) {
        console.error("Krynet error:", err);

        document.body.innerHTML = `
            <pre style="
                white-space: pre-wrap;
                padding: 20px;
                color: #ff5555;
                background: #111;
                font-family: monospace;
            ">Krynet API error:
${escapeHtml(err?.message || String(err))}
</pre>
        `;
    }
})();
</script>
