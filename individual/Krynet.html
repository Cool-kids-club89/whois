<!-- Existing WHOIS UI -->
<h1>OSINT / WHOIS Search</h1>

<div id="searchBar">
  <input
    id="inputSearch"
    type="text"
    placeholder="Username"
    autocomplete="off"
    spellcheck="false"
  >

  <button id="searchBtn" type="button">
    Search
  </button>
</div>

<main id="result" aria-live="polite">
  <div id="localProfile"></div>
  <div id="dynamicProfile"></div>
</main>

<!-- Existing D3 dependency -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- Existing WHOIS controller -->
<script type="module" src="./search.js"></script>

<!-- Krynet UI loader -->
<script>
(async () => {
    const API =
        "https://raw.githubusercontent.com/Krynet-LLC/Preview/refs/heads/main";

    async function getFile(path) {
        const url = `${API}/${path}`;

        const res = await fetch(url, {
            cache: "no-cache"
        });

        if (!res.ok) {
            throw new Error(`${path}: HTTP ${res.status}`);
        }

        return await res.text();
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>'"]/g, tag => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;"
        }[tag]));
    }

    try {
        /*
         * Load Krynet CSS.
         */
        const css = await getFile("styles.css");

        const style = document.createElement("style");
        style.textContent = css;
        document.head.appendChild(style);

        /*
         * Load Krynet index.html.
         */
        const html = await getFile("index.html");

        const doc = new DOMParser()
            .parseFromString(html, "text/html");

        /*
         * Do not execute scripts embedded inside
         * the remotely fetched index.html automatically.
         */
        doc.querySelectorAll("script").forEach(script => {
            script.remove();
        });

        /*
         * Put the fetched UI into its own container
         * instead of destroying the WHOIS application.
         */
        const krynetContainer =
            document.createElement("section");

        krynetContainer.id = "krynet-ui";

        krynetContainer.innerHTML =
            doc.body.innerHTML;

        document.body.appendChild(krynetContainer);

        /*
         * Load Krynet java.js.
         */
        let js = await getFile("java.js");

        /*
         * Redirect its config request to the
         * GitHub-hosted configuration.
         */
        const configUrl =
            `${API}/config.json`;

        js = js.replace(
            /fetch\s*\(\s*['"`]\.\/config\.json['"`]\s*,?/,
            `fetch("${configUrl}",`
        );

        const mainScript =
            document.createElement("script");

        mainScript.textContent = js;

        krynetContainer.appendChild(mainScript);

        /*
         * Re-execute scripts from Krynet's index.html,
         * except java.js, which was loaded above.
         */
        const originalScripts =
            Array.from(
                new DOMParser()
                    .parseFromString(
                        html,
                        "text/html"
                    )
                    .querySelectorAll("script")
            );

        for (const oldScript of originalScripts) {
            if (
                oldScript.src &&
                oldScript.src.includes("java.js")
            ) {
                continue;
            }

            const newScript =
                document.createElement("script");

            if (oldScript.src) {
                let src =
                    oldScript.getAttribute("src");

                if (
                    src &&
                    !src.startsWith("http://") &&
                    !src.startsWith("https://") &&
                    !src.startsWith("//")
                ) {
                    src =
                        `${API}/${src.replace(
                            /^\.?\//,
                            ""
                        )}`;
                }

                newScript.src = src;
                newScript.async = false;
            } else {
                newScript.textContent =
                    oldScript.textContent;
            }

            krynetContainer.appendChild(
                newScript
            );
        }

    } catch (err) {
        console.error(
            "Krynet error:",
            err
        );

        const error =
            document.createElement("pre");

        error.style.cssText = `
            white-space: pre-wrap;
            padding: 20px;
            color: #ff5555;
            background: #111;
            font-family: monospace;
        `;

        error.textContent =
            `Krynet API error:\n${err?.message || String(err)}`;

        document.body.appendChild(error);
    }
})();
</script>
