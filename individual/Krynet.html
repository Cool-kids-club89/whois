<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krynet</title>
</head>

<body>
    <div id="app">Loading...</div>

    <script>
    (async () => {
        const API =
            "https://raw.githubusercontent.com/Krynet-LLC/Preview/refs/heads/main";

        async function getFile(path) {
            const url = `${API}/${path}`;

            const res = await fetch(url, {
                cache: "no-cache"
            });

            if (!res.ok) {
                throw new Error(`${path}: HTTP ${res.status}`);
            }

            return await res.text();
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>'"]/g, tag => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"
            }[tag]));
        }

        try {
            /*
             * 1. CSS
             */
            const css = await getFile("styles.css");

            const style = document.createElement("style");
            style.textContent = css;
            document.head.appendChild(style);


            /*
             * 2. HTML
             */
            const html = await getFile("index.html");

            const doc = new DOMParser()
                .parseFromString(html, "text/html");

            /*
             * Remove scripts from index.html.
             * We will load the JavaScript ourselves.
             */
            doc.querySelectorAll("script").forEach(script => {
                script.remove();
            });

            /*
             * Copy body content.
             */
            document.body.innerHTML = doc.body.innerHTML;


            /*
             * 3. Load java.js
             *
             * IMPORTANT:
             * java.js expects config.json to be available at
             * "./config.json".
             *
             * We therefore provide config.json before executing
             * java.js by rewriting its fetch call below.
             */
            let js = await getFile("java.js");

            /*
             * Change:
             *
             * fetch('./config.json')
             *
             * into:
             *
             * fetch(GitHub config URL)
             */
            const configUrl =
                `${API}/config.json`;

            js = js.replace(
                /fetch\s*\(\s*['"`]\.\/config\.json['"`]\s*,?/,
                `fetch("${configUrl}",`
            );

            /*
             * Execute java.js.
             */
            const mainScript = document.createElement("script");

            mainScript.textContent = js;

            document.body.appendChild(mainScript);


            /*
             * 4. Re-execute any non-external scripts
             * from index.html if needed.
             *
             * External scripts are intentionally handled
             * separately because relative src paths may point
             * to the wrong host.
             */
            const originalScripts =
                Array.from(
                    new DOMParser()
                        .parseFromString(html, "text/html")
                        .querySelectorAll("script")
                );

            for (const oldScript of originalScripts) {

                /*
                 * Skip java.js if index.html already references it.
                 */
                if (
                    oldScript.src &&
                    oldScript.src.includes("java.js")
                ) {
                    continue;
                }

                const newScript =
                    document.createElement("script");

                if (oldScript.src) {
                    /*
                     * Convert relative script URLs to GitHub URLs.
                     */
                    let src = oldScript.getAttribute("src");

                    if (
                        src &&
                        !src.startsWith("http://") &&
                        !src.startsWith("https://") &&
                        !src.startsWith("//")
                    ) {
                        src = `${API}/${src.replace(/^\.?\//, "")}`;
                    }

                    newScript.src = src;
                    newScript.async = false;

                } else {
                    newScript.textContent =
                        oldScript.textContent;
                }

                document.body.appendChild(newScript);
            }

        } catch (err) {
            console.error("Krynet error:", err);

            document.body.innerHTML = `
                <pre style="
                    white-space: pre-wrap;
                    padding: 20px;
                    color: #ff5555;
                    background: #111;
                    font-family: monospace;
                ">Krynet API error:

${escapeHtml(err?.message || String(err))}</pre>
            `;
        }
    })();
    </script>
</body>
</html>
